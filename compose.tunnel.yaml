# Optional overlay for a remotely managed Cloudflare Tunnel.
# The public hostname is configured in Cloudflare to reach http://factura-mx:8787.
services:
  factura-mx:
    environment:
      APP_PUBLIC_ORIGIN: "https://${APP_TUNNEL_HOSTNAME:?Define APP_TUNNEL_HOSTNAME}"
      APP_ALLOWED_HOSTS: "localhost,127.0.0.1,${APP_TUNNEL_HOSTNAME:?Define APP_TUNNEL_HOSTNAME}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-false}"

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets:
      - source: cloudflare_tunnel_token
        target: cloudflare_tunnel_token
        uid: "65532"
        gid: "65532"
        mode: 0o400
    depends_on:
      - factura-mx
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
